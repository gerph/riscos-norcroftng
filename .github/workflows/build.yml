name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux cross-compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build ncc-riscos and n++-riscos
        run: |
          make ncc TARGET=riscos
          make n++ TARGET=riscos

      - name: Archive
        run: |
          mkdir -p dist
          tar czf dist/norcroft-ng-linux.tar.gz -C bin ncc-riscos n++-riscos

      - uses: actions/upload-artifact@v7
        with:
          name: norcroft-ng-linux
          path: dist/norcroft-ng-linux.tar.gz

  riscos:
    name: Native RISC OS compiler
    runs-on: ubuntu-latest
    container: gerph/riscos-build:latest
    steps:
      - uses: actions/checkout@v7

      # The build runs some host-side generator tools, so needs a host C compiler.
      - name: Ensure a host C compiler is available
        run: |
          command -v cc || (apt-get update && apt-get install -y build-essential)

      # Stage 1 is the cross-compiler; stage 2 uses it to build Norcroft NG
      # itself as native RISC OS executables (bin/ncc,ff8 and bin/n++,ff8).
      - name: Build stage 1 (cross-compilers)
        run: |
          make ncc TARGET=riscos
          make n++ TARGET=riscos

      - name: Build stage 2 (native RISC OS compilers)
        run: |
          make ncc TARGET=riscos HOST=riscos LD=riscos-link
          make n++ TARGET=riscos HOST=riscos LD=riscos-link

      # Run each native compiler on the RISC OS Build Service, compiling a
      # trivial source to assembler on stdout. The sources use RISC OS
      # directory-as-extension layout (c/t, cpp/t) as a real RISC OS tool
      # would see them.
      - name: Test native compilers with riscos-build-run
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p smoketest/c smoketest/cpp
          printf 'int main(void) { return 0; }\n' > smoketest/c/t
          printf 'class Foo { public: int bar() { return 1; } };\nint main(void) { Foo f; return f.bar(); }\n' > smoketest/cpp/t
          riscos-build-run "bin/ncc,ff8" smoketest/ --command "ncc c.t -S -o -" --timeout 120 | tee ncc.out
          grep -q "EXPORT main" ncc.out
          riscos-build-run "bin/n++,ff8" smoketest/ --command "n++ cpp.t -S -o -" --timeout 120 | tee npp.out
          grep -q "EXPORT main" npp.out

      # rozipfile (from the rozipinfo package) records each file's RISC OS
      # filetype in the zip itself, rather than as a literal ",ff8" leafname.
      - name: Archive
        run: |
          apt-get update && apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install rozipinfo
          mkdir -p dist
          cd bin
          "$RUNNER_TEMP/venv/bin/python" -m rozipfile --create ../dist/norcroft-ng-riscos.zip "ncc,ff8" "n++,ff8"

      - uses: actions/upload-artifact@v7
        with:
          name: norcroft-ng-riscos
          path: dist/norcroft-ng-riscos.zip

  # Pushing a tag such as v1.0.0 creates a draft GitHub release carrying both
  # archives. It is left as a draft so that it can be checked and its notes
  # written before it is published.
  release:
    name: Draft release
    needs: [linux, riscos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the built archives
        uses: actions/download-artifact@v8
        with:
          pattern: norcroft-ng-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          prerelease: false
          artifacts: "dist/norcroft-ng-linux.tar.gz,dist/norcroft-ng-riscos.zip"
